name: Docker Build and Push

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish when manually running the workflow
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve image version
      id: version
      shell: bash
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          version="${{ inputs.version }}"
        else
          version="${GITHUB_REF_NAME}"
        fi
        version="${version#v}"
        image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "image=${image}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/${{ matrix.arch }}
        push: true
        tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-manifest:
    name: Publish multi-architecture tags
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Publish image manifest
      env:
        IMAGE: ${{ needs.build.outputs.image }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        major="${VERSION%%.*}"
        minor="${VERSION%.*}"
        docker buildx imagetools create \
          --tag "$IMAGE:$VERSION" \
          --tag "$IMAGE:$minor" \
          --tag "$IMAGE:$major" \
          --tag "$IMAGE:latest" \
          "$IMAGE:$VERSION-amd64" \
          "$IMAGE:$VERSION-arm64"
