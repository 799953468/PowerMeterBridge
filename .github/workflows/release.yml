name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

env:
  DOTNET_VERSION: '11.0.x'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.lookup_release.outputs.upload_url || steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          tag="${{ inputs.tag }}"
        else
          tag="${GITHUB_REF#refs/tags/}"
        fi
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

    - name: Check for existing release
      id: lookup_release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${{ steps.get_version.outputs.tag }}"
        if release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null); then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "upload_url=$(echo "$release" | jq -r .upload_url)" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release
      id: create_release
      if: steps.lookup_release.outputs.exists != 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        release_name: Release ${{ steps.get_version.outputs.tag }}
        draft: false
        prerelease: false
        body: |
          ## PowerMeterBridge ${{ steps.get_version.outputs.version }}

          First public release of PowerMeterBridge.

          ### Features

          - Collect CNYIoT prepaid electricity meter readings and support multiple configured meters.
          - Publish readings and Home Assistant MQTT Discovery entities for energy, balance, consumption, cost, and current power.
          - Persist per-device state and consumption history across restarts and meter recharges.
          - Provide multi-architecture Docker images and native AOT binaries for Linux, macOS, and Windows.
          - Include unit tests for meter readings and persisted bridge state.

          ### Installation

          Download the binary for your platform, extract the archive, configure `appsettings.json`, then run `PowerMeterBridge 60`.

          Docker image: `docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}`

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.tag }}/CHANGELOG.md) for details.

  build-and-upload:
    name: Build and Upload (${{ matrix.runtime }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact_name: PowerMeterBridge
            asset_name: powermeterbridge-linux-x64
            release_asset_name: powermeterbridge-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
            artifact_name: PowerMeterBridge
            asset_name: powermeterbridge-linux-arm64
            release_asset_name: powermeterbridge-linux-arm64.tar.gz
          - os: macos-latest
            runtime: osx-x64
            artifact_name: PowerMeterBridge
            asset_name: powermeterbridge-macos-x64
            release_asset_name: powermeterbridge-macos-x64.tar.gz
          - os: macos-latest
            runtime: osx-arm64
            artifact_name: PowerMeterBridge
            asset_name: powermeterbridge-macos-arm64
            release_asset_name: powermeterbridge-macos-arm64.tar.gz
          - os: windows-latest
            runtime: win-x64
            artifact_name: PowerMeterBridge.exe
            asset_name: powermeterbridge-windows-x64.exe
            release_asset_name: powermeterbridge-windows-x64.exe.zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Check for existing release asset
      id: asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ needs.create-release.outputs.tag }}" --jq '.assets[].name' | grep -Fxq '${{ matrix.release_asset_name }}'; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Publish AOT binary
      if: steps.asset.outputs.exists != 'true'
      run: |
        dotnet publish src/PowerMeterBridge/PowerMeterBridge.csproj -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained \
          -o ./publish \
          -p:PublishAot=true \
          -p:StripSymbols=true \
          -p:IlcOptimizationPreference=Speed
      shell: bash

    - name: Package binary (Unix)
      if: runner.os != 'Windows' && steps.asset.outputs.exists != 'true'
      run: |
        cd publish
        tar czf ../${{ matrix.asset_name }}.tar.gz \
          ${{ matrix.artifact_name }} \
          appsettings.json.example
        cd ..

    - name: Package binary (Windows)
      if: runner.os == 'Windows' && steps.asset.outputs.exists != 'true'
      run: |
        cd publish
        7z a ../${{ matrix.asset_name }}.zip `
          ${{ matrix.artifact_name }} `
          appsettings.json.example
        cd ..
      shell: pwsh

    - name: Upload Release Asset (Unix)
      if: runner.os != 'Windows' && steps.asset.outputs.exists != 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./${{ matrix.asset_name }}.tar.gz
        asset_name: ${{ matrix.asset_name }}.tar.gz
        asset_content_type: application/gzip

    - name: Upload Release Asset (Windows)
      if: runner.os == 'Windows' && steps.asset.outputs.exists != 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./${{ matrix.asset_name }}.zip
        asset_name: ${{ matrix.asset_name }}.zip
        asset_content_type: application/zip
