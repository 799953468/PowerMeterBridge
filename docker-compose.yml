version: '3.8'

services:
  powermeterbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: powermeterbridge
    restart: unless-stopped

    # Environment variables (can override config file settings)
    environment:
      - TZ=Asia/Shanghai

    # Mount configuration and data persistence
    volumes:
      - ./appsettings.json:/app/appsettings.json:ro
      - ./data:/app/data

    # Command: polling interval in seconds
    command: ["60"]

    # Network mode: bridge (default)
    # Use 'host' if you need direct network access
    # network_mode: host

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "PowerMeterBridge"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: MQTT broker for local testing
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    profiles:
      - with-mqtt

networks:
  default:
    name: powermeterbridge-network
